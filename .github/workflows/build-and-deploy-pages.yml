name: Build and Deploy pages to GitHub Pages
on: [push, workflow_dispatch]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  list-branches:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.set-branches.outputs.branches }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get branch list and set output
        id: set-branches
        run: |
          BRANCHES=$(
            git branch -r |
            grep -Ev 'HEAD|v1|v2' |
            sed 's/^[ *]*//' |
            sed 's/^origin\///' |
            jq -R . |
            jq -cs
          )
          echo "branches=$BRANCHES" >> "$GITHUB_OUTPUT"

  build-compat-pages:
    needs: list-branches
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.list-branches.outputs.branches) }}
    name: Build for ${{ matrix.branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
      - name: Build cache key
        id: cache-key
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          HASH=$(git rev-parse --short HEAD)
          SAFE_BRANCH="${BRANCH//\//-}"
          echo "SAFE_BRANCH=$SAFE_BRANCH" >> "$GITHUB_ENV"
          echo "CACHE_KEY=$SAFE_BRANCH-$HASH" >> "$GITHUB_ENV"
      - name: Restore cached artifacts
        id: artifacts-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SAFE_BRANCH }}
          key: ${{ env.CACHE_KEY }}
      - uses: actions/setup-node@v7
        if: steps.artifacts-restore.outputs.cache-hit != 'true'
        with:
          node-version: 26
          cache: npm
      - name: Build
        if: steps.artifacts-restore.outputs.cache-hit != 'true'
        run: |
          npm run prepare-monorepo
          npm run build-compat
          npm run bundle
      - name: Prepare build artifacts
        if: steps.artifacts-restore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ env.SAFE_BRANCH }}/compat
          cp tests/compat/index.html tests/compat/compat-data.js tests/compat/tests.js tests/compat/browsers-runner.js ${{ env.SAFE_BRANCH }}/compat
          mkdir -p ${{ env.SAFE_BRANCH }}/bundles
          cp tests/bundles/* ${{ env.SAFE_BRANCH }}/bundles
          mkdir -p ${{ env.SAFE_BRANCH }}/unit-browser
          cp tests/unit-browser/* ${{ env.SAFE_BRANCH }}/unit-browser
      - name: Save cached artifacts
        if: steps.artifacts-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SAFE_BRANCH }}
          key: ${{ env.CACHE_KEY }}
      # written after the cache, so a branch restored from a cache older than this step gets it too: the
      # sauce-labs job waits for the deployed pages to carry the commit it tests
      - name: Mark the commit of the artifacts
        run: git rev-parse HEAD > "$SAFE_BRANCH/commit.txt"
      - name: Upload artifacts for branch ${{ matrix.branch }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SAFE_BRANCH }}
          path: ${{ env.SAFE_BRANCH }}

  combine-pages-and-deploy:
    needs: build-compat-pages
    runs-on: ubuntu-latest
    # a push to any branch deploys the whole site, and Pages refuses a deployment while another one is in progress
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: pages
      # artifacts are shared by all attempts of a run, so a re-run downloads the Pages artifact of the previous attempt
      - name: Drop Pages artifacts of previous attempts
        run: rm -rf pages/github-pages*
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  # the browsers the CI runners lack, on the pages just deployed - see tests/saucelabs/AGENTS.md
  sauce-labs:
    needs: [list-branches, combine-pages-and-deploy]
    # the credentials exist in this repository only, and pages exist for the branches listed above only
    if: github.repository == 'zloirock/core-js' && contains(fromJson(needs.list-branches.outputs.branches), github.ref_name)
    runs-on: ubuntu-latest
    # reports without failing the workflow while the failures it found on the old engines are open
    continue-on-error: true
    permissions:
      contents: read
    # a newer push redeploys the pages of the branch under a running job, which then fails anyway
    concurrency:
      group: sauce-labs-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm run prepare-monorepo
      # the deploy reports an `http:` address, and an insecure context hides APIs that real sites have;
      # the directory is named after the branch, and a branch name may hold `#` or `%`
      - run: |
          url=${PAGE_URL/#http:/https:}
          npm run test-saucelabs -- "${url%/}/$(jq -rn --arg branch "${GITHUB_REF_NAME//\//-}" '$branch | @uri')" "$GITHUB_SHA"
        env:
          PAGE_URL: ${{ needs.combine-pages-and-deploy.outputs.page-url }}
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}

name: Build and Deploy pages to GitHub Pages
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  list-branches:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.set-branches.outputs.branches }}
      recipe: ${{ steps.set-branches.outputs.recipe }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get branch list and set output
        id: set-branches
        run: |
          BRANCHES=$(
            git branch -r |
            grep -Ev '^ *origin/(HEAD|v1|v2)( |$)' |
            sed 's/^[ *]*//' |
            sed 's/^origin\///' |
            jq -R . |
            jq -cs
          )
          echo "branches=$BRANCHES" >> "$GITHUB_OUTPUT"
          # the artifacts of a branch are cached per build recipe too: a matrix job checks out that branch, not this file
          echo "recipe=$(sha256sum .github/workflows/build-and-deploy-pages.yml | cut -c1-16)" >> "$GITHUB_OUTPUT"

  build-compat-pages:
    needs: list-branches
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.list-branches.outputs.branches) }}
    name: Build for ${{ matrix.branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch == github.ref_name && github.sha || matrix.branch }}
      - name: Build cache key
        id: cache-key
        env:
          BRANCH: ${{ matrix.branch }}
          RECIPE: ${{ needs.list-branches.outputs.recipe }}
        run: |
          HASH=$(git rev-parse --short HEAD)
          SAFE_BRANCH="${BRANCH//\//-}"
          echo "SAFE_BRANCH=$SAFE_BRANCH" >> "$GITHUB_ENV"
          echo "CACHE_KEY=$SAFE_BRANCH-$HASH-$RECIPE" >> "$GITHUB_ENV"
      - name: Restore cached artifacts
        id: artifacts-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SAFE_BRANCH }}
          key: ${{ env.CACHE_KEY }}
      - uses: actions/setup-node@v7
        if: steps.artifacts-restore.outputs.cache-hit != 'true'
        with:
          node-version: 26
          cache: npm
      - name: Build
        if: steps.artifacts-restore.outputs.cache-hit != 'true'
        run: |
          npm run prepare-monorepo
          npm run build-compat
          npm run bundle
      - name: Prepare build artifacts
        if: steps.artifacts-restore.outputs.cache-hit != 'true'
        # git allows `$`, `;`, `(`, quotes and alike in branch names, so the name is a quoted variable, not a part of the script
        run: |
          mkdir -p "$SAFE_BRANCH/compat"
          cp tests/compat/index.html tests/compat/compat-data.js tests/compat/tests.js tests/compat/browsers-runner.js "$SAFE_BRANCH/compat"
          mkdir -p "$SAFE_BRANCH/bundles"
          cp tests/bundles/* "$SAFE_BRANCH/bundles"
          mkdir -p "$SAFE_BRANCH/unit-browser"
          cp tests/unit-browser/* "$SAFE_BRANCH/unit-browser"
      - name: Save cached artifacts
        if: steps.artifacts-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SAFE_BRANCH }}
          key: ${{ env.CACHE_KEY }}
      # written after the cache, so a branch restored from a cache older than this step gets it too: the
      # sauce-labs job checks the deployed pages against the triggering commit. The Pages CDN can serve
      # a cached bundle under an updated commit.txt: a commit query in the script URLs bypasses that cache,
      # and a marker in each bundle reports which build the browser executed
      - name: Mark the commit of the artifacts
        run: |
          sha=$(git rev-parse HEAD)
          echo "$sha" > "$SAFE_BRANCH/commit.txt"
          sed -i "s#\(src='[^':?]*\.js\)'#\1?$sha'#g" "$SAFE_BRANCH"/unit-browser/*.html
          for bundle in "$SAFE_BRANCH"/bundles/*.js; do
            printf '\n;(window.bundleCommits = window.bundleCommits || []).push("%s");\n' "$sha" >> "$bundle"
          done
      - name: Upload artifacts for branch ${{ matrix.branch }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SAFE_BRANCH }}
          path: ${{ env.SAFE_BRANCH }}

  combine-pages-and-deploy:
    needs: build-compat-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # a push to any branch deploys the whole site, and Pages refuses a deployment while another one is in progress
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment-retry.outputs.page_url || steps.deployment.outputs.page_url }}
    outputs:
      page-url: ${{ steps.deployment-retry.outputs.page_url || steps.deployment.outputs.page_url }}
      # a failed build of the triggering branch leaves no pages of its commit to test
      testable: ${{ steps.built.outputs.built == 'true' && (steps.deployment.outcome == 'success' || steps.deployment-retry.outcome == 'success') }}
    steps:
      - uses: actions/checkout@v7
      # Skip a run whose branch has advanced while it waited for the Pages slot.
      - name: Check the triggering branch before publishing
        id: current
        run: |
          head=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale deployment: $GITHUB_SHA is not the head of $GITHUB_REF_NAME"
          fi
      - name: Download artifacts
        if: steps.current.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          path: pages
      # artifacts are shared by all attempts of a run, so a re-run downloads the Pages artifact of the previous attempt
      - name: Drop Pages artifacts of previous attempts
        if: steps.current.outputs.publish == 'true'
        run: rm -rf pages/github-pages*
      - name: Check the pages of the triggering commit
        id: built
        if: steps.current.outputs.publish == 'true'
        run: |
          if [ "$(cat "pages/${GITHUB_REF_NAME//\//-}/commit.txt" 2>/dev/null)" = "$GITHUB_SHA" ]; then
            echo 'built=true' >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no pages of $GITHUB_SHA were built, the Sauce Labs run is skipped"
          fi
      - name: Setup Pages
        if: steps.current.outputs.publish == 'true'
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        if: steps.current.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages
          name: github-pages-${{ github.run_attempt }}
      # Pages deployments can remain queued until the action's timeout. A fresh deployment
      # of the same artifact may succeed after the timed-out deployment is canceled.
      # See https://github.com/actions/deploy-pages/issues/406.
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.current.outputs.publish == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages (retry)
        id: deployment-retry
        if: steps.current.outputs.publish == 'true' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  # the browsers the CI runners lack, on the pages just deployed - see tests/saucelabs/AGENTS.md
  sauce-labs:
    needs: [list-branches, combine-pages-and-deploy]
    # the credentials exist in this repository only, and pages exist for the branches listed above only
    if: needs.combine-pages-and-deploy.outputs.testable == 'true' && github.repository == 'zloirock/core-js' && contains(fromJson(needs.list-branches.outputs.branches), github.ref_name)
    runs-on: ubuntu-latest
    # reports without failing the workflow while the failures it found on the old engines are open
    continue-on-error: true
    permissions:
      contents: read
    # a newer push of the branch supersedes its run without holding the Pages deployment slot; runs of
    # different branches share the ten session slots of the account, and Sauce Labs queues the excess
    concurrency:
      group: sauce-labs-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm run prepare-monorepo
      # the pages are served over `http:`: Firefox before 27 speaks no TLS version the Pages CDN still
      # accepts, and over `https:` it shows its own error page, which the runner reports as no reporter.
      # The pages hold no API an insecure context hides, and all their resources are same-origin. The
      # directory is named after the branch, and a branch name may hold `#` or `%`
      - run: |
          url=${PAGE_URL/#https:/http:}
          npm run test-saucelabs -- "${url%/}/$(jq -rn --arg branch "${GITHUB_REF_NAME//\//-}" '$branch | @uri')" "$GITHUB_SHA"
        env:
          PAGE_URL: ${{ needs.combine-pages-and-deploy.outputs.page-url }}
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          SAUCE_SESSIONS_FILE: ${{ runner.temp }}/sauce-sessions
      # a cancelled run is killed with its sessions open; a session created after the list was written
      # ends after the 90 idle seconds of Sauce Labs
      - name: Close the Sauce Labs sessions of a cancelled run
        if: cancelled()
        run: |
          [ -f "$SAUCE_SESSIONS_FILE" ] || exit 0
          while read -r id; do
            curl -sS -o /dev/null --max-time 30 -u "$SAUCE_USERNAME:$SAUCE_ACCESS_KEY" -X DELETE \
              "https://ondemand.us-west-1.saucelabs.com/wd/hub/session/$id" || true
          done < "$SAUCE_SESSIONS_FILE"
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          SAUCE_SESSIONS_FILE: ${{ runner.temp }}/sauce-sessions

name: ci

# every job skips a pull request from a branch of this repository: the push to that branch already runs it
on: [push, pull_request]

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  lint:
    if: &not-duplicate github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - run: npm run prepare-monorepo
      - run: pip install codespell
      - run: npx run-s lint-raw

  type-definitions:
    if: *not-duplicate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm run prepare-monorepo
      - run: npx run-s build-types types-coverage test-type-definitions-all

  karma:
    if: *not-duplicate
    runs-on: windows-2022
    env:
      PLAYWRIGHT_BROWSERS_PATH: D:\ms-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.0.0
          cache: npm
      # the browsers belong to the playwright version, not to the lockfile: keying on the file
      # would re-download a gigabyte on every unrelated dependency bump
      - id: playwright
        shell: bash
        run: |
          version=$(node -p "require('./tests/karma/package-lock.json').packages['node_modules/playwright'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: D:\ms-playwright
          key: playwright-windows-2022-${{ steps.playwright.outputs.version }}
      - run: npm run prepare-monorepo
      - run: npx run-s bundle-package test-unit-karma

  e2e-usage-pure-karma:
    if: *not-duplicate
    runs-on: windows-2022
    env:
      PLAYWRIGHT_BROWSERS_PATH: D:\ms-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.0.0
          cache: npm
      # the browsers belong to the playwright version, not to the lockfile: keying on the file
      # would re-download a gigabyte on every unrelated dependency bump
      - id: playwright
        shell: bash
        run: |
          version=$(node -p "require('./tests/karma/package-lock.json').packages['node_modules/playwright'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: D:\ms-playwright
          key: playwright-windows-2022-${{ steps.playwright.outputs.version }}
      - run: npm run prepare-monorepo
      - run: npm run test-e2e-usage-pure-karma

  e2e-libs:
    runs-on: windows-2022
    env:
      PLAYWRIGHT_BROWSERS_PATH: D:\ms-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.0.0
          cache: npm
      # the browsers belong to the playwright version, not to the lockfile: keying on the file
      # would re-download a gigabyte on every unrelated dependency bump
      - id: playwright
        shell: bash
        run: |
          version=$(node -p "require('./tests/karma/package-lock.json').packages['node_modules/playwright'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: D:\ms-playwright
          key: playwright-windows-2022-${{ steps.playwright.outputs.version }}
      - run: npm run prepare-monorepo
      - run: npm run test-e2e-libs
      # the per-cell pages are the node pre-flight's table, re-runnable in a browser, and
      # manifest.json carries what the browsers made of each cell - the IE11 verdict among them is
      # the one only this job produces. A cell that died before its page was written has neither,
      # and its reason is in the log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-libs-artifacts
          path: tests/e2e-libs/artifacts

  bun:
    if: *not-duplicate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm run prepare-monorepo
      - run: npx run-s bundle-package test-unit-bun

  promises:
    if: *not-duplicate
    strategy:
      matrix:
        node:
          - ^22.22.2
          - ^24.15
          - 25
          - 26
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm run prepare-monorepo
      - run: npm run test-promises

  tests:
    if: *not-duplicate
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - ^22.22.2
          - ^24.15
          - 25
          - 26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm run prepare-monorepo
      - run: npx run-s bundle-package test-unit-node test-entries test-compat-data test-compat-tools test-builder

  transpiling:
    if: *not-duplicate
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - ^22.22.2
          - ^24.15
          - 25
          - 26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm run prepare-monorepo
      - run: npm run test-transpiling

  transpiler-perf:
    if: *not-duplicate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm run prepare-monorepo
      - run: npm run test-transpiler-perf -- --samples=3

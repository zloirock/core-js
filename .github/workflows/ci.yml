name: ci

# every job skips a pull request from a branch of this repository: the push to that branch already runs it
on: [push, pull_request]

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  lint:
    if: &not-duplicate github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - run: npm run prepare-monorepo
      - run: pip install codespell
      - run: npx run-s lint-raw

  karma:
    if: *not-duplicate
    runs-on: windows-2022
    env:
      PLAYWRIGHT_BROWSERS_PATH: D:\ms-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ^24.18
          cache: npm
      - uses: actions/cache@v6
        with:
          path: D:\ms-playwright
          key: playwright-windows-2022-${{ hashFiles('tests/unit-karma/package-lock.json') }}
      - run: npm run prepare-monorepo
      - run: npx run-s bundle test-unit-karma

  bun:
    if: *not-duplicate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm run prepare-monorepo
      - run: npx run-s bundle test-unit-bun

  promises-and-observables:
    if: *not-duplicate
    strategy:
      matrix:
        node:
          - ^20.19
          - ^22.12
          - 23
          - 24
          - 25
          - 26
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm run prepare-monorepo
      - run: npx run-s test-promises test-observables

  tests:
    if: *not-duplicate
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - ^20.19
          - ^22.12
          - 23
          - 24
          - 25
          - 26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm run prepare-monorepo
      - run: npx run-s bundle test-unit-node test-entries test-compat-data test-compat-tools test-builder
